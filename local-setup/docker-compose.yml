# Local DevOps stack for DevOps-Project-38.
# Run `kind create cluster` FIRST (it creates the external "kind" network Jenkins joins).
name: devops38

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: devops38-jenkins
    container_name: jenkins
    user: root            # lets Jenkins use the Docker Desktop socket (local learning setup only)
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [devops, kind]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    networks: [devops]
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8081:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
    volumes:
      - nexus_data:/nexus-data
    networks: [devops]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [devops]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter
    container_name: blackbox
    ports:
      - "9115:9115"
    networks: [devops]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks: [devops]
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [devops]
    restart: unless-stopped

networks:
  devops: {}
  kind:
    external: true

volumes:
  jenkins_home: {}
  sonar_data: {}
  sonar_extensions: {}
  nexus_data: {}
  grafana_data: {}
