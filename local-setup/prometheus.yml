global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Is the blogging app answering? (app is port-forwarded to your Mac on 8090)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8090/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # CPU / memory / disk of the Docker Desktop VM
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Jenkins metrics (needs the "Prometheus metrics" plugin)
  - job_name: 'jenkins'
    metrics_path: /prometheus
    static_configs:
      - targets: ['jenkins:8080']
